<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Оплату підтверджено — Start Amazon</title>
  <style>
    :root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#0d0d12;color:#edeae2;font-family:Arial,sans-serif}.card{width:min(100%,520px);padding:42px 28px;text-align:center;background:linear-gradient(145deg,#1a1a24,#111119);border:1px solid rgba(240,180,41,.25);border-radius:24px;box-shadow:0 24px 80px rgba(0,0,0,.35)}.check{width:74px;height:74px;margin:0 auto 22px;display:grid;place-items:center;border-radius:50%;background:#1c8b59;color:#fff;font-size:42px}.eyebrow{margin:0 0 10px;color:#f0b429;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.title{margin:0 0 14px;font-size:clamp(28px,7vw,42px);line-height:1.08}.text{margin:0 auto 26px;max-width:400px;color:#b7b3bd;font-size:16px;line-height:1.55}.hint{margin:18px 0 0;color:#77737e;font-size:12px;line-height:1.5}.button{display:inline-block;padding:15px 24px;border-radius:12px;background:linear-gradient(135deg,#f7c95a,#d99600);color:#1a0f00;font-weight:700;text-decoration:none}.button:hover{filter:brightness(1.08)}
  </style>
</head>
<body><main class="card"><div class="check">✓</div><p class="eyebrow">Start Amazon</p><h1 class="title">Оплату підтверджено!</h1><p class="text">Перевір пошту, яку вказав під час оплати. Туди прийде лист для створення пароля та входу в особистий кабінет.</p><a class="button" href="https://trityakk.github.io/deploy/enter.html">Відкрити кабінет</a><p class="hint">Якщо листа немає — перевір папку «Спам» або «Промоакції».</p></main></body>
</html>
